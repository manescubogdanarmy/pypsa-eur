# Maximum Complexity Scenario: All Energy Sources of Romania
# Run name: romania-2023-complex

tutorial: true
run:
  name: romania-2023-complex
  disable_progressbar: true
  shared_resources:
    policy: false
scenario:
  clusters:
  - 5
  opts:
  - ''
countries:
- RO
snapshots:
  start: '2023-12-01'
  end: '2023-12-08'
electricity:
  co2limit_enable: true
  co2limit: 100000000.0
  extendable_carriers:
    Generator:
    - solar
    - solar-hsat
    - onwind
    - offwind-ac
    - offwind-dc
    - offwind-float
    - OCGT
    - CCGT
    - nuclear
    - coal
    - lignite
    - biomass
    - geothermal
    - oil
    StorageUnit:
    - battery
    Store:
    - H2
    Link:
    - H2 pipeline
  conventional_carriers:
  - nuclear
  - oil
  - OCGT
  - CCGT
  - coal
  - lignite
  - geothermal
  - biomass
  renewable_carriers:
  - solar
  - solar-hsat
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - hydro
  powerplants_filter: (DateOut >= 2024 or DateOut != DateOut)
  estimate_renewable_capacities:
    enable: true
    from_gem: true
    year: 2023
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar
atlite:
  default_cutout: europe-2023-sarah3-era5
  cutouts:
    europe-2023-sarah3-era5:
      module:
      - sarah
      - era5
      x:
      - -12.0
      - 42.0
      y:
      - 33.0
      - 72.0
      dx: 0.3
      dy: 0.3
      time:
      - '2023'
      - '2023'
renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false
clustering:
  exclude_carriers: []
  temporal:
    resolution_elec: 24h
lines:
  dynamic_line_rating:
    activate: true
    max_line_rating: 1.3
solving:
  solver:
    name: highs
    options: highs-simplex
  check_objective:
    enable: false
